; ============================================================================
;  quickres.ini  -  resolution presets for POV-Ray for Windows
; ----------------------------------------------------------------------------
;  Where it lives:  Documents\POV-Ray\v3.7\ini\quickres.ini
;  (or in the POV-Ray menu: Tools -> Edit resolution INI file)
;
;  Every [section] shows up in the resolution dropdown in the toolbar.
;  I added the [Movement ...] presets at the top for my car animation.
;  If your quickres.ini already has other entries, just paste my three
;  [Movement ...] blocks at the top and keep the rest. Restart POV-Ray after
;  saving, otherwise the dropdown doesn't update.
;
;  How to render the animation:
;    1. open movement.pov
;    2. pick one of the [Movement ...] presets in the dropdown
;    3. hit Run
;  POV-Ray then renders one PNG per frame (movement001.png, movement002.png...)
;  into the same folder as the .pov file. Put them together into a video
;  afterwards (see README).
;
;  The clock goes from 0 to 1 over all frames. 240 frames at 24 fps = 10 s.
; ============================================================================

[Movement Preview 480x270, 60 frames]
; quick test of the whole motion - takes about a minute
Width=480
Height=270
Antialias=Off
Initial_Frame=1
Final_Frame=60
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N
Declare=Soft_Shadows=0

[Movement 1280x720, 240 frames, AA 0.3]
; good compromise, roughly 10 - 15 min on the school PC
Width=1280
Height=720
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Initial_Frame=1
Final_Frame=240
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N

[Movement 1920x1080, 240 frames, AA 0.3]
; the real thing, roughly 25 - 35 min on the school PC
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Initial_Frame=1
Final_Frame=240
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N

[Movement Still 1920x1080, AA 0.3]
; single picture from the middle of the drive, e.g. for a poster / the handout
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Clock=0.5
Output_File_Type=N

; ----------------------------------------------------------------------------
;  standard presets (the ones POV-Ray ships with)
; ----------------------------------------------------------------------------

[512x384, No AA]
Width=512
Height=384
Antialias=Off

[640x480, No AA]
Width=640
Height=480
Antialias=Off

[640x480, AA 0.3]
Width=640
Height=480
Antialias=On
Antialias_Threshold=0.3

[800x600, AA 0.3]
Width=800
Height=600
Antialias=On
Antialias_Threshold=0.3

[1024x768, AA 0.3]
Width=1024
Height=768
Antialias=On
Antialias_Threshold=0.3

[1280x1024, AA 0.3]
Width=1280
Height=1024
Antialias=On
Antialias_Threshold=0.3
