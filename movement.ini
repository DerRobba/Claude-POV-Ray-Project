; movement.ini - Abgabe-Animation in 1080p, genau 4 Sekunden (100 Bilder, 25 fps)
; Kommandozeile:  povray movement.ini
; Windows: Render -> Edit Settings/Render, dort bei "Ini-File" diese Datei waehlen
Input_File_Name=movement.pov
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Initial_Frame=1
Final_Frame=100
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N
