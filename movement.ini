; movement.ini - same settings as the 1080p quickres preset, for the command line
; or for "Render -> Edit settings / Render" in POV-Ray for Windows:
;   povray movement.ini
Input_File_Name=movement.pov
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Initial_Frame=1
Final_Frame=240
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N
