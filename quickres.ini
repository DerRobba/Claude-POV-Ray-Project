; ============================================================================
;  quickres.ini  -  Aufloesungs-Presets fuer POV-Ray fuer Windows
; ----------------------------------------------------------------------------
;  Wo die Datei liegt:  Dokumente\POV-Ray\v3.7\ini\quickres.ini
;  (oder im POV-Ray-Menue: Tools -> Edit resolution INI file)
;
;  Jeder [Abschnitt] erscheint oben in der Aufloesungs-Liste. Ich habe
;  Eintraege fuer meine zwei Animationen hinzugefuegt:
;    [Movement ...]   -> movement.pov  (die Abgabe, genau 4 Sekunden)
;    [Car Drive ...]  -> car_drive.pov (die Auto-Animation, 10 Sekunden)
;  Wenn deine quickres.ini schon andere Eintraege hat: meine Bloecke einfach
;  oben reinkopieren und den Rest lassen. Danach POV-Ray neu starten,
;  sonst taucht nichts in der Liste auf.
;
;  Rendern: .pov-Datei oeffnen, Preset in der Liste auswaehlen, Run.
;  POV-Ray speichert dann ein PNG pro Bild (movement001.png ...) im selben
;  Ordner. Zum Video zusammenfuegen: siehe README.
;
;  clock laeuft immer von 0 bis 1 ueber alle Bilder.
;  movement:  100 Bilder bei 25 fps = genau 4,0 s
;  car_drive: 240 Bilder bei 24 fps = 10 s
; ============================================================================

[Movement Vorschau 480x270, 100 Bilder]
; schneller Test der ganzen Bewegung, dauert ca. 1-2 Minuten
Width=480
Height=270
Antialias=Off
Initial_Frame=1
Final_Frame=100
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N
Declare=Weiche_Schatten=0

[Movement 1280x720, 100 Bilder, AA 0.3]
Width=1280
Height=720
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Initial_Frame=1
Final_Frame=100
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N

[Movement 1920x1080, 100 Bilder, AA 0.3]
; die richtige Abgabe-Version
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Initial_Frame=1
Final_Frame=100
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N

[Movement Standbild 1920x1080]
; ein einzelnes Bild bei 3 s (clock 0.75), z.B. fuers Programmiertagebuch
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Clock=0.75
Output_File_Type=N

[Car Drive Preview 480x270, 60 frames]
Width=480
Height=270
Antialias=Off
Initial_Frame=1
Final_Frame=60
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N
Declare=Soft_Shadows=0

[Car Drive 1920x1080, 240 frames, AA 0.3]
Width=1920
Height=1080
Antialias=On
Antialias_Threshold=0.3
Antialias_Depth=3
Sampling_Method=2
Initial_Frame=1
Final_Frame=240
Initial_Clock=0
Final_Clock=1
Cyclic_Animation=Off
Output_File_Type=N

; ----------------------------------------------------------------------------
;  Standard-Presets (die liefert POV-Ray so mit)
; ----------------------------------------------------------------------------

[512x384, No AA]
Width=512
Height=384
Antialias=Off

[640x480, No AA]
Width=640
Height=480
Antialias=Off

[640x480, AA 0.3]
Width=640
Height=480
Antialias=On
Antialias_Threshold=0.3

[800x600, AA 0.3]
Width=800
Height=600
Antialias=On
Antialias_Threshold=0.3

[1024x768, AA 0.3]
Width=1024
Height=768
Antialias=On
Antialias_Threshold=0.3

[1280x1024, AA 0.3]
Width=1280
Height=1024
Antialias=On
Antialias_Threshold=0.3
